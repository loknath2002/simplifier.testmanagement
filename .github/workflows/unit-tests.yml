name: NET Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  app-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        cache: false

    - name: Restore Dependencies
      run: dotnet restore ./Simplifier.TestManagement.sln

    - name: Build Project
      run: dotnet build ./Simplifier.TestManagement.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test ./Simplifier.TestManagement.Tests/Simplifier.TestManagement.Tests.csproj --no-build --no-restore --configuration Release --verbosity normal